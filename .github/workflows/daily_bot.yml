name: Daily PropTech Bot

on:
  schedule:
    # KST 자정(00시) = UTC 15시
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  daily-run:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r pipeline/requirements.txt
        playwright install chromium --with-deps
        
    - name: Create robust .env file for bot
      run: |
        mkdir -p pipeline
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> pipeline/.env
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> pipeline/.env
        
    - name: Run Master Daily Script
      run: |
        python 32_master_daily_run.py
        
    - name: Commit and Push Updated Data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add web/src/data/kb50_stats.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Daily Bot] 확정 실거래가 & 호가 데이터 갱신" && git push)
